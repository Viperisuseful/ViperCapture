<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Open-source webpage rendering with ViperCapture." />
    <link rel="icon" type="image/svg+xml" href="/static/vipercapture-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViperCapture | Open-source webpage rendering</title>
    <script>
      (() => {
        const stored = localStorage.getItem("theme")
        document.documentElement.classList.toggle("dark", stored === null ? matchMedia("(prefers-color-scheme: dark)").matches : stored === "dark")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
