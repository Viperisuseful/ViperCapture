[package]
name = "vipercapture-desktop"
version = "0.2.1"
description = "Tauri desktop shell foundation for ViperCapture"
authors = ["viperisuseful"]
license = "MIT"
repository = "https://github.com/Viperisuseful/ViperCapture"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vipercapture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2.9.0"
tauri-plugin-mobile-capture = { path = "../plugins/tauri-plugin-mobile-capture" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2.3.5"
rand = "0.10.2"
open = "5.4.1"
