name: ViperCapture visual check
description: Capture a page deterministically with a self-hosted ViperCapture server.
inputs:
  url:
    description: URL to capture
    required: true
  api-url:
    description: ViperCapture render endpoint
    required: false
    default: http://localhost:8000/v1/render
  api-key:
    description: Project API key
    required: false
  output:
    description: Artifact path
    required: false
    default: vipercapture.png
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VIPERCAPTURE_API_KEY: ${{ inputs.api-key }}
        VIPERCAPTURE_ACTION_PATH: ${{ github.action_path }}
        VIPERCAPTURE_ACTION_API_URL: ${{ inputs.api-url }}
        VIPERCAPTURE_ACTION_URL: ${{ inputs.url }}
        VIPERCAPTURE_ACTION_OUTPUT: ${{ inputs.output }}
      run: >-
        python3 "$VIPERCAPTURE_ACTION_PATH/skills/vipercapture/scripts/capture.py"
        --api-url "$VIPERCAPTURE_ACTION_API_URL" --url "$VIPERCAPTURE_ACTION_URL"
        --output-path "$VIPERCAPTURE_ACTION_OUTPUT" --deterministic --force
