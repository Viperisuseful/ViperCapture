worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 100m;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.31.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $http_x_request_id $upstream_request_id {
    "" $request_id;
    default $http_x_request_id;
  }
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

  log_format structured escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"request_time":$request_time}';
  access_log /dev/stdout structured;
  error_log /dev/stderr warn;

  upstream renderer {
    server vipercapture:8000 max_fails=2 fail_timeout=10s;
    keepalive 16;
  }

  server {
    listen 8080;
    limit_req zone=per_ip burst=30 nodelay;
    limit_conn connections_per_ip 20;

    location = /health {
      proxy_pass http://renderer;
      access_log off;
    }

    location = /ready {
      proxy_pass http://renderer;
      access_log off;
    }

    location = /metrics { return 404; }
    location ^~ /v1/admin/ { return 404; }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $upstream_request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      # Queue admission is capped at 30s and rendering has a 75s total deadline.
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_pass http://renderer;
    }
  }
}
