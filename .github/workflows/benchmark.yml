name: Same-host benchmark

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/benchmark.yml"
      - "!benchmarks/results/**"
  workflow_dispatch:
    inputs:
      runs:
        description: Measured runs per provider and real-site scenario
        required: true
        default: "30"
      include_managed:
        description: Include ScreenshotOne and Urlbox when secrets are configured
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SCREENSHOTONE_ACCESS_KEY: ${{ secrets.SCREENSHOTONE_ACCESS_KEY }}
      URLBOX_SECRET: ${{ secrets.URLBOX_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install benchmark client
        run: python -m pip install -r requirements.txt
      - name: Build and start ViperCapture on the runner
        run: |
          docker build --tag vipercapture:benchmark .
          docker run --detach --name vipercapture-benchmark \
            --shm-size=1g --publish 127.0.0.1:8000:8000 \
            --env VIPERCAPTURE_MAX_CONCURRENCY=1 vipercapture:benchmark
      - name: Start Browserless on the same runner
        run: |
          docker run --detach --name browserless-benchmark \
            --shm-size=1g --publish 127.0.0.1:3000:3000 \
            --env TOKEN=benchmark-token \
            ghcr.io/browserless/chromium:v2.55.1@sha256:611b88859cb367a0bfd8d34fbd510d9783b7cede6729cfa8e7f6e19677084fbf
          echo 'BROWSERLESS_TOKEN=benchmark-token' >> "$GITHUB_ENV"
      - name: Wait for both providers
        run: |
          for endpoint in http://127.0.0.1:8000/ready http://127.0.0.1:3000/docs; do
            for attempt in $(seq 1 180); do
              curl --fail --silent "$endpoint" >/dev/null && break
              sleep 1
            done
            curl --fail --silent "$endpoint" >/dev/null
          done
      - name: Run longer real-site set from one host
        env:
          REQUESTED_RUNS: ${{ inputs.runs }}
          INCLUDE_MANAGED: ${{ inputs.include_managed }}
        run: |
          requested_runs="${REQUESTED_RUNS:-10}"
          providers=(
            --provider viper=http://127.0.0.1:8000
            --provider browserless=http://127.0.0.1:3000
          )
          if test "$INCLUDE_MANAGED" = true; then
            test -n "$SCREENSHOTONE_ACCESS_KEY"
            test -n "$URLBOX_SECRET"
            providers+=(
              --provider screenshotone=https://api.screenshotone.com/take
              --provider urlbox=https://api.urlbox.com/v1/render/sync
            )
          fi
          mkdir -p benchmark-results
          python benchmarks/run.py "${providers[@]}" \
            --scenarios benchmarks/scenarios-real-sites.json \
            --runs "$requested_runs" --warmups 2 \
            --output benchmark-results/same-host-real-sites.json
          python benchmarks/report.py benchmark-results/same-host-real-sites.json \
            benchmark-results/same-host-real-sites.md \
            --title "Same-host real-site rendering benchmark"
      - name: Provider diagnostics
        if: always()
        run: |
          mkdir -p benchmark-results
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "runner_image=ubuntu-22.04"
            uname -a
            lscpu
            free -b
            docker version
          } > benchmark-results/runner-environment.txt 2>&1 || true
          docker inspect vipercapture-benchmark browserless-benchmark \
            > benchmark-results/container-inspect.json || true
          docker logs vipercapture-benchmark > benchmark-results/vipercapture.log 2>&1 || true
          docker logs browserless-benchmark > benchmark-results/browserless.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: same-host-real-sites
          path: benchmark-results/
          if-no-files-found: warn
