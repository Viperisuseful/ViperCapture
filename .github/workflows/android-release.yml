name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: android-v0.1.3
      publish:
        description: Publish a GitHub release after the build passes
        required: true
        type: boolean
        default: false
  push:
    tags:
      - android-v*

permissions:
  contents: write

jobs:
  build:
    name: Android universal APK and AAB
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci --prefix desktop

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > desktop/src-tauri/gen/android/app/upload-keystore.jks
          {
            printf 'storeFile=app/upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > desktop/src-tauri/gen/android/keystore.properties

      - name: Validate frontend
        run: |
          npm run lint --prefix desktop
          npm run build --prefix desktop

      - name: Build signed Android packages
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        working-directory: desktop
        run: npm run tauri -- android build --apk --aab --ci

      - name: Verify signatures and create checksums
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          APK="$(find desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name '*universal-release.apk' -print -quit)"
          AAB="$(find desktop/src-tauri/gen/android/app/build/outputs/bundle -type f -name '*universal-release.aab' -print -quit)"
          test -n "$APK"
          test -n "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify -certs "$AAB"
          mkdir -p artifacts
          VERSION="${RELEASE_TAG#android-v}"
          cp "$APK" "artifacts/ViperCapture-Android-v${VERSION}-universal.apk"
          cp "$AAB" "artifacts/ViperCapture-Android-v${VERSION}-universal.aab"
          cd artifacts
          sha256sum *.apk *.aab > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-universal
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish Android release
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v') || inputs.publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-universal
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ViperCapture Android ${RELEASE_TAG#android-v}" \
            --generate-notes \
            --notes "Android 10 or newer. The APK is signed and ready for direct installation; the AAB is included for store distribution."
