name: Operational readiness

on:
  pull_request:
    paths:
      - "vipercapture/**"
      - "benchmarks/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/operational-readiness.yml"
      - "!benchmarks/results/**"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  sustained-load-and-recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install renderer
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start renderer
        run: |
          VIPERCAPTURE_ASYNC_JOBS=1 VIPERCAPTURE_SCHEDULES=0 \
            VIPERCAPTURE_MAX_CONCURRENCY=2 \
            uvicorn vipercapture.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/vipercapture-operational.log 2>&1 &
          echo $! > /tmp/vipercapture-operational.pid
          for attempt in $(seq 1 120); do
            curl --fail --silent http://127.0.0.1:8000/ready >/dev/null && exit 0
            sleep 0.25
          done
          cat /tmp/vipercapture-operational.log
          exit 1
      - name: Concurrency saturation matrix
        run: |
          mkdir -p operational-results
          for concurrency in 1 2 4 8; do
            python -m benchmarks.production_gate load \
              --requests 40 --concurrency "$concurrency" --max-p95-ms 20000 \
              --output "operational-results/concurrency-${concurrency}.json"
          done
      - name: Five-minute sustained-load gate
        run: >-
          python -m benchmarks.production_gate load
          --requests 120 --concurrency 4 --duration-seconds 300
          --max-p95-ms 15000
          --output operational-results/sustained-load.json
      - name: Stop first renderer
        if: always()
        run: |
          if test -f /tmp/vipercapture-operational.pid; then
            kill "$(cat /tmp/vipercapture-operational.pid)" || true
          fi
      - name: Crash and restart recovery gate
        run: >-
          python -m benchmarks.production_gate restart-recovery
          --output operational-results/restart-recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-readiness
          path: |
            operational-results/
            /tmp/vipercapture-operational.log
          if-no-files-found: warn

  constrained-memory:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag vipercapture:operational .
      - name: Start under a 1 GiB hard limit
        run: |
          docker run --detach --name vipercapture-memory \
            --memory=1g --memory-swap=1g --pids-limit=512 --shm-size=256m \
            --env VIPERCAPTURE_MAX_CONCURRENCY=1 \
            --env VIPERCAPTURE_MAX_PIXELS=12000000 \
            --publish 127.0.0.1:8000:8000 vipercapture:operational
          for attempt in $(seq 1 160); do
            curl --fail --silent http://127.0.0.1:8000/ready >/dev/null && exit 0
            sleep 0.5
          done
          docker logs vipercapture-memory
          exit 1
      - name: Constrained-memory render gate
        run: |
          docker exec vipercapture-memory python -m benchmarks.production_gate load \
            --api-url http://127.0.0.1:8000 --requests 40 --concurrency 1 \
            --max-p95-ms 20000 --require-memory-limit \
            --output /tmp/constrained-memory.json
          mkdir -p operational-results
          docker cp vipercapture-memory:/tmp/constrained-memory.json \
            operational-results/constrained-memory.json
          test "$(docker inspect --format '{{.State.OOMKilled}}' vipercapture-memory)" = false
      - name: Container diagnostics
        if: always()
        run: |
          mkdir -p operational-results
          docker stats --no-stream vipercapture-memory || true
          docker inspect vipercapture-memory > operational-results/container-inspect.json || true
          docker logs vipercapture-memory > operational-results/container.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constrained-memory
          path: operational-results/
          if-no-files-found: warn
