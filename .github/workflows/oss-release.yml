name: OSS release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages and the GitHub prerelease
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}
        run: |
          expected="v$(python -c 'import json; print(json.load(open("release/versions.json"))["oss"])')"
          test -z "$RELEASE_TAG" || test "$RELEASE_TAG" = "$expected"
          if test "$RELEASE_TAG" = "$expected" || test "$MANUAL_PUBLISH" = true; then
            remote_lines="$(git ls-remote origin "refs/tags/${expected}" "refs/tags/${expected}^{}")"
            tagged_commit="$(printf '%s\n' "$remote_lines" | awk '/\^\{\}$/ {print $1}')"
            test -n "$tagged_commit"
            test "$tagged_commit" = "$GITHUB_SHA"
          fi
      - name: Build repository bundles
        run: python scripts/build_release.py --output-dir dist
      - name: Build Python SDK
        run: |
          python -m pip install build
          python -m build sdk/python --outdir dist/python
      - name: Build TypeScript SDK
        run: |
          npm ci --prefix sdk/typescript
          npm pack ./sdk/typescript --pack-destination dist/typescript
      - name: Checksums
        run: python scripts/write_checksums.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: oss-release-packages
          path: dist/
          if-no-files-found: error
      - name: Publish Go module tag
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          version="$(python -c 'import json; print(json.load(open("release/versions.json"))["oss"])')"
          go_tag="sdk/go/v${version}"
          remote_lines="$(git ls-remote origin "refs/tags/${go_tag}" "refs/tags/${go_tag}^{}")"
          if test -n "$remote_lines"; then
            remote_commit="$(printf '%s\n' "$remote_lines" | awk '/\^\{\}$/ {print $1}')"
            test -n "$remote_commit" || remote_commit="$(printf '%s\n' "$remote_lines" | head -n 1 | cut -f 1)"
            test "$remote_commit" = "$GITHUB_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$go_tag" "$GITHUB_SHA" --message "ViperCapture Go SDK ${version}"
            git push origin "refs/tags/${go_tag}"
          fi
      - name: Publish Python SDK with trusted publishing
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages_dir: dist/python/
          skip_existing: true
      - name: Publish TypeScript SDK
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="$(node -p "require('./sdk/typescript/package.json').name")"
          version="$(node -p "require('./sdk/typescript/package.json').version")"
          if npm view "${package}@${version}" version --json >/dev/null 2>&1; then
            echo "${package}@${version} is already published"
          else
            npm publish dist/typescript/*.tgz --access public --tag beta
          fi
      - name: Publish GitHub prerelease
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0-beta.2' }}
        run: |
          mapfile -t assets < <(find dist -type f -print)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name')"
            download_dir="$(mktemp -d)"
            for asset in "${assets[@]}"; do
              asset_name="$(basename "$asset")"
              if grep -Fxq -- "$asset_name" <<< "$existing_assets"; then
                gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                  --pattern "$asset_name" --dir "$download_dir"
                if cmp -s "$asset" "$download_dir/$asset_name"; then
                  echo "${asset_name} is already attached with matching bytes"
                else
                  gh release upload "$RELEASE_TAG" "$asset" \
                    --repo "$GITHUB_REPOSITORY" --clobber
                fi
              else
                gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "ViperCapture OSS ${RELEASE_TAG#v} Developer Beta" \
              --notes-file docs/releases/v0.1.0-beta.2.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "ViperCapture OSS ${RELEASE_TAG#v} Developer Beta" \
              --notes-file docs/releases/v0.1.0-beta.2.md
          fi

  container:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect immutable version image
        id: version-image
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          VERSION_IMAGE: ghcr.io/viperisuseful/vipercapture:v0.1.0-beta.2
        run: |
          if docker buildx imagetools inspect "$VERSION_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image without publication
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/viperisuseful/vipercapture:v0.1.0-beta.2
          labels: |
            org.opencontainers.image.source=https://github.com/Viperisuseful/ViperCapture
            org.opencontainers.image.version=0.1.0-beta.2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish new immutable version image
        if: ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)) && steps.version-image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/viperisuseful/vipercapture:v0.1.0-beta.2
            ghcr.io/viperisuseful/vipercapture:beta
          labels: |
            org.opencontainers.image.source=https://github.com/Viperisuseful/ViperCapture
            org.opencontainers.image.version=0.1.0-beta.2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reuse immutable version image on rerun
        if: ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)) && steps.version-image.outputs.exists == 'true'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/viperisuseful/vipercapture:beta \
            ghcr.io/viperisuseful/vipercapture:v0.1.0-beta.2
