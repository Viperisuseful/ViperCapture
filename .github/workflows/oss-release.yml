name: OSS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  IMAGE: ghcr.io/viperisuseful/vipercapture

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Validate reviewed release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [[ ! "$tag" =~ $semver ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          git fetch origin master
          release_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_commit" origin/master
          test "$(tr -d '\r\n' < VERSION)" = "${tag#v}"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + ":" + .object.sha')"
          test "${tag_object%%:*}" = tag
          tag_sha="${tag_object#*:}"
          tag_document="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
          test "$(jq -r .tag <<< "$tag_document")" = "$tag"
          test "$(jq -r .verification.verified <<< "$tag_document")" = true
          test "$(jq -r .object.type <<< "$tag_document")" = commit
          test "$(jq -r .object.sha <<< "$tag_document")" = "$release_commit"
          version="${tag#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          exists=false
          if inspection="$(docker buildx imagetools inspect "$IMAGE:$version" 2>&1)"; then
            exists=true
          elif ! grep -Eqi 'manifest unknown|not found' <<< "$inspection"; then
            echo "$inspection" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend
          git diff --exit-code -- static/app
      - name: Publish version image
        if: steps.version.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Viperisuseful/ViperCapture
            org.opencontainers.image.revision=${{ steps.version.outputs.commit }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve version image
        id: container
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          inspection="$(docker buildx imagetools inspect "$IMAGE:$VERSION")"
          digest="$(awk '$1 == "Digest:" {print $2; exit}' <<< "$inspection")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$digest"
          revision="$(docker image inspect "$IMAGE@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$revision" = "$RELEASE_COMMIT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Smoke published image
        run: |
          docker run --detach --init --name vipercapture-release-smoke \
            --publish 127.0.0.1:8000:8000 \
            "$IMAGE@${{ steps.container.outputs.digest }}"
          python scripts/smoke.py --base-url http://127.0.0.1:8000
      - name: Remove smoke container
        if: always()
        run: docker rm --force vipercapture-release-smoke 2>/dev/null || true
      - name: Attest container provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          flags=(--verify-tag --generate-notes --title "ViperCapture $VERSION")
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
