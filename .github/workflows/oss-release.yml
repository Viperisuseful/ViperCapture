name: OSS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  IMAGE: ghcr.io/viperisuseful/vipercapture

jobs:
  publish:
    concurrency:
      group: oss-release
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Validate reviewed release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
          test "$(tr -d '\r\n' < VERSION)" = "${tag#v}"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + ":" + .object.sha')"
          test "${tag_object%%:*}" = tag
          tag_sha="${tag_object#*:}"
          tag_document="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
          test "$(jq -r .tag <<< "$tag_document")" = "$tag"
          test "$(jq -r .verification.verified <<< "$tag_document")" = true
          test "$(jq -r .object.type <<< "$tag_document")" = commit
          test "$(jq -r .object.sha <<< "$tag_document")" = "$GITHUB_SHA"
          version="${tag#v}"
          alias="latest"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            alias="beta"
            prerelease=true
          fi
          exists=false
          if inspection="$(docker buildx imagetools inspect "$IMAGE:$version" 2>&1)"; then
            exists=true
          elif ! grep -Eqi 'manifest unknown|not found' <<< "$inspection"; then
            echo "$inspection" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend
          git diff --exit-code -- static/app
      - name: Publish version image
        if: steps.version.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Viperisuseful/ViperCapture
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve version image
        id: container
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image_document="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Image}}')"
          test "$(jq -r '.config.Labels["org.opencontainers.image.revision"]' <<< "$image_document")" = "$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Smoke published image
        run: |
          docker run --detach --init --name vipercapture-release-smoke \
            --publish 127.0.0.1:8000:8000 \
            "$IMAGE@${{ steps.container.outputs.digest }}"
          python scripts/smoke.py --base-url http://127.0.0.1:8000
      - name: Remove smoke container
        if: always()
        run: docker rm --force vipercapture-release-smoke 2>/dev/null || true
      - name: Promote release alias
        env:
          ALIAS: ${{ steps.version.outputs.alias }}
          DIGEST: ${{ steps.container.outputs.digest }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          git fetch --force --tags origin
          if [[ "$PRERELEASE" == true ]]; then
            newest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-' | sort -V | tail -n 1)"
          else
            newest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          fi
          if [[ "$GITHUB_REF_NAME" == "$newest" ]]; then
            docker buildx imagetools create --tag "$IMAGE:$ALIAS" "$IMAGE@$DIGEST"
          else
            echo "Not moving $ALIAS backward from newer release $newest"
          fi
      - name: Attest container provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          flags=(--verify-tag --generate-notes --title "ViperCapture $VERSION")
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
