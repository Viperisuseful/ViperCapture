name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  web-and-renderer:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Check frontend
        run: |
          npm run lint --prefix frontend
          npm run build --prefix frontend
          git diff --exit-code -- static/app
      - name: Check launcher installer selection
        run: python -m unittest tests.test_launch_installer
      - name: Build and smoke container
        run: |
          python -m compileall -q vipercapture launch.py scripts/smoke.py
          docker build --tag vipercapture:validation .
          docker run --detach --init --name vipercapture-validation \
            --publish 127.0.0.1:8000:8000 vipercapture:validation
          trap 'docker rm --force vipercapture-validation' EXIT
          python scripts/smoke.py --base-url http://127.0.0.1:8000

  windows-web-and-renderer:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg
        shell: pwsh
        run: |
          $exitCode = 1
          foreach ($attempt in 1..3) {
            choco install ffmpeg --yes --no-progress
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) { break }
            Start-Sleep -Seconds (5 * $attempt)
          }
          if ($exitCode -ne 0) { exit $exitCode }
          ffmpeg -version
      - name: Install renderer and browsers
        run: |
          uv pip install --system -r requirements.txt
          python -m playwright install chromium firefox webkit
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Check Python and render engines
        run: |
          python -m compileall -q vipercapture launch.py scripts/smoke.py
          python -m unittest tests.test_launch_installer
          python scripts/smoke.py
      - name: Check frontend
        run: |
          npm run lint --prefix frontend
          npm run build --prefix frontend
          git diff --exit-code -- static/app
