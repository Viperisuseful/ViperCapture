name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: desktop-v0.2.1
      publish:
        description: Publish a GitHub release after all builds pass
        required: true
        type: boolean
        default: false
  push:
    tags:
      - desktop-v*

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: msi,nsis
            artifact: windows-x64
            paths: |
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS Apple Silicon
            os: macos-15
            bundles: dmg
            artifact: macos-arm64
            paths: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-15-intel
            bundles: dmg
            artifact: macos-x64
            paths: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x64
            os: ubuntu-22.04
            bundles: deb
            artifact: linux-x64
            paths: desktop/src-tauri/target/release/bundle/deb/*.deb

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            rpm \
            wget

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements.txt

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: python desktop/scripts/check_release_version.py desktop

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Python and frontend dependencies
        run: |
          python -m pip install -r desktop/requirements.txt
          npm ci --prefix desktop

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium firefox webkit

      - name: Build and test packaged renderer
        run: |
          python desktop/scripts/build_sidecar.py
          python desktop/scripts/smoke_sidecar.py

      - name: Validate frontend and Rust
        run: |
          npm run lint --prefix desktop
          npm run build --prefix desktop
          npm run tauri:check --prefix desktop

      - name: Build native packages
        working-directory: desktop
        run: npm run tauri:build -- --bundles "${{ matrix.bundles }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          mapfile -d '' release_assets < <(find artifacts -type f -print0)
          test "${#release_assets[@]}" -gt 0
          gh release create "$RELEASE_TAG" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "ViperCapture Desktop ${RELEASE_TAG#desktop-v} Beta" \
            --generate-notes \
            --notes "Beta release. Includes unsigned Windows x64, macOS Apple Silicon and Intel, and Linux x64 packages. Windows SmartScreen and macOS Gatekeeper may warn until platform signing certificates are configured."
