services:
  vipercapture:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VIPERCAPTURE_PUBLIC_URL: ${VIPERCAPTURE_PUBLIC_URL:-http://127.0.0.1:8000}
      VIPERCAPTURE_MAX_CONCURRENCY: ${VIPERCAPTURE_MAX_CONCURRENCY:-1}
      VIPERCAPTURE_SIGNING_SECRET: ${VIPERCAPTURE_SIGNING_SECRET:-}
      VIPERCAPTURE_SIGNING_ADMIN_TOKEN: ${VIPERCAPTURE_SIGNING_ADMIN_TOKEN:-}
      VIPERCAPTURE_WEBHOOK_SECRET: ${VIPERCAPTURE_WEBHOOK_SECRET:-}
    volumes:
      - vipercapture-data:/data
    shm_size: 512mb
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
      - /app/captures:size=67108864,uid=10001,gid=10001,mode=0700
      - /home/vipercapture/.cache:size=67108864,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  vipercapture-data:
